name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean build_windows.spec
      - name: Run unit tests
        run: python -m pytest -q
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist/Docu2TeX -DestinationPath Docu2TeX-Windows.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Docu2TeX-Windows
          path: Docu2TeX-Windows.zip
      - name: Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Docu2TeX-Windows.zip
